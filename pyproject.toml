[project]
name = "crateclean"
version = "0.1.0.dev0"
description = "Clean junk out of DJ music tags and find missing cover art, without breaking your Rekordbox library."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Bobby Filippopoulos" }]
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28",
  "keyring>=25",
  "mutagen>=1.47",
  "PySide6>=6.8",
]

[project.urls]
Homepage = "https://github.com/bflip12/crateclean"
Issues = "https://github.com/bflip12/crateclean/issues"

[project.scripts]
crateclean-cli = "crateclean.cli:main"

[project.gui-scripts]
crateclean = "crateclean.ui.app:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.10",
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-qt>=4.4",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # import sorting
  "B",       # likely bugs
  "UP",      # modern syntax
  "SIM",     # simplifications
  "PTH",     # pathlib instead of os.path
  "RUF",     # ruff's own rules
  "D",       # docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are named for their behaviour, so they don't need docstrings beyond the module's.
"tests/**" = ["D101", "D102", "D103", "D107"]
# Qt overrides (paintEvent, data, rowCount) are documented by Qt.
"src/crateclean/ui/**" = ["D102", "D107"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
strict = [
  "src/crateclean/engine",
  "src/crateclean/match",
  "src/crateclean/apis",
  "src/crateclean/store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "windows: runs only on Windows",
  "macos: runs only on macOS",
]
