name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add music folder …
        2. Open the cleanup preview …
        3. …
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 26.1, Windows 11 24H2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CrateClean version or commit
      description: The version in About CrateClean, or the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages or the run report
      render: text
